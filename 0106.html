<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>AI 影像分析結果</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    h2 { color: #2c3e50; }
    #result { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
    img { max-width: 300px; display: block; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>AI 影像分析系統</h2>

  <label for="imageUpload">上傳胸腔X光影像：</label>
  <input type="file" id="imageUpload" accept="image/*"><br>

  <div id="previewContainer"></div>
  <button onclick="analyzeImage()">分析影像</button>

  <div id="result"></div>

  <script>
    function analyzeImage() {
      const fileInput = document.getElementById('imageUpload');
      const resultDiv = document.getElementById('result');
      const previewContainer = document.getElementById('previewContainer');

      if (fileInput.files.length === 0) {
        alert("請先選擇影像檔案！");
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        previewContainer.innerHTML = `<img src="${e.target.result}" alt="上傳影像預覽">`;

        // 模擬 AI 分析結果（實際可改用 fetch 送到後端分析）
        const aiResult = {
          finding: "肺炎跡象",
          confidence: "91%"
        };

        resultDiv.innerHTML = `
          <h3>AI 分析結果：</h3>
          <p><strong>發現：</strong> ${aiResult.finding}</p>
          <p><strong>信心指數：</strong> ${aiResult.confidence}</p>
        `;
      };

      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
